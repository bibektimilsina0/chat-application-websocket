<mat-card class="auth-card">
  <mat-card-header>
    <mat-card-title>{{ mode() === 'login' ? 'Log in' : 'Create account' }}</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field appearance="outline">
        <mat-label>Username</mat-label>
        <input matInput formControlName="username" autocomplete="username" />
        @if (form.controls.username.hasError('minlength')) {
          <mat-error>At least 3 characters</mat-error>
        }
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input matInput type="password" formControlName="password" autocomplete="current-password" />
        @if (form.controls.password.hasError('minlength')) {
          <mat-error>At least 8 characters</mat-error>
        }
      </mat-form-field>

      @if (error()) {
        <p class="error">{{ error() }}</p>
      }

      <button mat-flat-button type="submit" [disabled]="form.invalid || loading()">
        {{ mode() === 'login' ? 'Log in' : 'Register' }}
      </button>
      <button mat-button type="button" (click)="toggleMode()">
        {{ mode() === 'login' ? 'Need an account? Register' : 'Have an account? Log in' }}
      </button>
    </form>
  </mat-card-content>
</mat-card>
